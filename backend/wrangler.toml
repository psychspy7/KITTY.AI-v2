RELEASE_REPOSITORY = "psychspy7/KITTY.AI-v2"
GOOGLE_WEB_CLIENT_ID = "34203306703-u82o8grcs0qr2j30dgsf84bue2v7is22.apps.googleusercontent.com"
HISTORY_MODE = "local"

[[hyperdrive]]
binding = "CONTEXT"
id = "b35a29067b844ab9ae79894aeef72228"

[ai]
